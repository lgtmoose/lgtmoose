name: Security scans

# Dependency and container image scanning (NIC-844, see SECURITY.md). It fails on high and
# critical findings that aren't accepted:
#
# - npm advisories: tools/security/audit.mjs over `pnpm audit`, every dependency, dev ones
#   included. Accepted ones are in .github/security/accepted-advisories.json, each with a reason
#   and an expiry.
# - Image vulnerabilities: Trivy on the control, egress proxy and sandbox images, built here as
#   CDK builds them (for the runner's architecture; deploys build arm64 from the same Dockerfiles
#   and pinned base images). Only vulnerabilities with a fix count, since an unfixed one in the
#   base image can't be acted on. Accepted ones are in .trivyignore, each with a reason and an
#   `exp:` date.
# - Dockerfile misconfigurations: Trivy's config checks.
#
# It runs on pull requests and pushes that change dependencies, Dockerfiles, the pinned CLI
# versions or this setup, and weekly on main, which catches advisories published after a merge.
# Unrelated PRs don't run it, so a newly published advisory can't block them; the weekly run
# shows it instead.
on:
  pull_request:
    paths:
      - pnpm-lock.yaml
      - "**/package.json"
      - "**/Dockerfile"
      - .dockerignore
      - packages/harness/src/version.ts
      - .trivyignore
      - .github/security/**
      - .github/workflows/security.yml
      - tools/security/**
  push:
    branches: [main]
    paths:
      - pnpm-lock.yaml
      - "**/package.json"
      - "**/Dockerfile"
      - .dockerignore
      - packages/harness/src/version.ts
      - .trivyignore
      - .github/security/**
      - .github/workflows/security.yml
      - tools/security/**
  schedule:
    # Mondays, 06:17 UTC.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependencies:
    name: dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # pnpm audit reads the lockfile; nothing needs installing.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Test the gate
        run: node --test tools/security/audit.test.mjs
      - name: Audit dependencies
        run: node tools/security/audit.mjs

  images:
    name: image scan (${{ matrix.image.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image:
          - { name: control, file: apps/control/Dockerfile, context: . }
          - { name: egress-proxy, file: apps/egress-proxy/Dockerfile, context: apps/egress-proxy }
          - { name: sandbox, file: infra/sandbox/Dockerfile, context: . }
    steps:
      - uses: actions/checkout@v7
      - name: Build the image
        env:
          FILE: ${{ matrix.image.file }}
          CONTEXT: ${{ matrix.image.context }}
          TAG: lgtmoose-${{ matrix.image.name }}:scan
        run: docker build --file "$FILE" --tag "$TAG" "$CONTEXT"
      # The images have npm, npx, corepack and yarn removed: check what each runs still works,
      # with a read-only root filesystem as in the task.
      - name: Check the image still starts
        env:
          NAME: ${{ matrix.image.name }}
          TAG: lgtmoose-${{ matrix.image.name }}:scan
        run: |
          set -euo pipefail
          case "$NAME" in
            egress-proxy)
              docker run --detach --name proxy --read-only -p 3128:3128 \
                -e ALLOWED_HOSTS=api.anthropic.com "$TAG"
              for attempt in $(seq 1 20); do
                if curl -fsS http://127.0.0.1:3128/healthz; then echo; exit 0; fi
                sleep 1
              done
              docker logs proxy
              exit 1
              ;;
            control)
              docker run --rm --read-only --entrypoint sh "$TAG" -c \
                'node --version && git --version && ! command -v npm && test -f /app/dist/index.js'
              ;;
            sandbox)
              docker run --rm --read-only --tmpfs /tmp -e HOME=/tmp --entrypoint sh "$TAG" -c \
                'node --version && claude --version && codex --version && ! command -v npm && test -f /app/dist/index.js'
              ;;
          esac
      # Pinned by commit: it runs with the job's token. Its own actions are pinned by commit too.
      - name: Scan for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: lgtmoose-${{ matrix.image.name }}:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore
          format: table

  dockerfiles:
    name: Dockerfile misconfigurations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Check the Dockerfiles
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          trivyignores: .trivyignore
          # Fixtures are review data; tools/test-postgres is the test database CI starts, never
          # deployed.
          skip-dirs: node_modules,packages/evals/fixtures,tools/test-postgres
