name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# One job per concern, all running side by side, so a failure says what broke. The checks that
# take a few seconds share one job, since GitHub bills every job as at least a minute. Every job
# replays unchanged turbo tasks from the shared remote cache.
#
# On pull requests, turbo runs only the packages the PR changes and the packages that depend on
# them (`--affected`, compared with the base branch, so those jobs check out full history).
# Changing turbo.json or a file in its globalDependencies (the root package.json, tsconfig, .nvmrc,
# pnpm-workspace.yaml, lint config, test Postgres image, this workflow) counts as changing
# everything. Pushes to main always run every task, from a shallow checkout.
env:
  AFFECTED: ${{ github.event_name == 'pull_request' && '--affected' || '' }}
jobs:
  static:
    name: format, root lint, migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # Prettier only re-checks files whose contents changed since the cached run.
      - uses: actions/cache@v6
        with:
          path: node_modules/.cache/prettier
          key: prettier-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', '.prettierrc*') }}-${{ github.sha }}
          restore-keys: prettier-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', '.prettierrc*') }}-
      - name: Format
        run: pnpm turbo run format:check
      - name: Lint files outside the packages
        run: pnpm turbo run lint:root
      - name: Migrations match the schema
        run: pnpm turbo run check-migrations

  # Oxlint's type-aware rules need the same built dependency types as typecheck.
  typecheck:
    name: typecheck, lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}
      - uses: ./.github/actions/setup
      - run: pnpm turbo run typecheck lint $AFFECTED

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}
      - uses: ./.github/actions/setup
      - run: pnpm turbo run test $AFFECTED

  test-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LGTMOOSE_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}
      # Started in the background, so pulling and booting it overlaps with setup instead of
      # holding the job up the way a `services:` container does.
      # The image is pinned in tools/test-postgres/Dockerfile, where Dependabot updates it.
      - name: Start Postgres
        run: |
          image=$(sed -n 's/^FROM //p' tools/test-postgres/Dockerfile)
          docker run -d --name postgres -p 5432:5432 -e POSTGRES_PASSWORD=postgres \
            "$image" > /tmp/postgres.log 2>&1 &
      - uses: ./.github/actions/setup
      - name: Wait for Postgres
        run: |
          for _ in $(seq 1 60); do
            docker exec postgres pg_isready -U postgres >/dev/null 2>&1 && exit 0
            sleep 1
          done
          cat /tmp/postgres.log
          exit 1
      - run: pnpm turbo run test:integration $AFFECTED

  # Builds every package, then runs the built CLI the way a user does.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}
      - uses: ./.github/actions/setup
      - run: pnpm turbo run build smoke $AFFECTED

  synth:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}
      - uses: ./.github/actions/setup
      - run: pnpm turbo run synth $AFFECTED
