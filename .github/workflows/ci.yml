name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The jobs run side by side. Within `verify`, turbo runs every task concurrently as far as the
# dependency graph allows, and replays any task whose inputs haven't changed from the cache.
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      # ESLint and Prettier only re-check files that changed since the cached run.
      - uses: actions/cache@v6
        with:
          path: |
            node_modules/.cache/eslint
            node_modules/.cache/prettier
          key: lint-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'eslint.config.js', '.prettierrc*') }}-${{ github.sha }}
          restore-keys: |
            lint-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'eslint.config.js', '.prettierrc*') }}-

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Postgres with pgvector, so migrations also run through the real runner on a real server.
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      # Turbo's task cache, keyed by branch (a PR's head branch, not its NN/merge ref). A new
      # branch falls back to the newest cache from main.
      - uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.head_ref || github.ref_name }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ github.head_ref || github.ref_name }}-
            turbo-${{ runner.os }}-main-

      # typecheck, test, build, run the built CLI, migrations match the schema, cdk synth.
      - name: Verify
        run: pnpm verify --summarize
        env:
          LGTMOOSE_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

      # The restored cache is saved again under a new key, so keep only what this run used.
      - name: Prune the turbo cache
        run: pnpm exec tsx scripts/prune-turbo-cache.ts
