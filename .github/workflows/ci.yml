name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# One job per concern, all running side by side, so a failure says what broke. The checks that
# take a few seconds share one job, since GitHub bills every job as at least a minute. Every job
# replays unchanged turbo tasks from the shared remote cache.
jobs:
  static:
    name: format, lint, migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # ESLint and Prettier only re-check files whose contents changed since the cached run.
      - uses: actions/cache@v6
        with:
          path: |
            node_modules/.cache/eslint
            node_modules/.cache/prettier
          key: lint-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'eslint.config.js', '.prettierrc*') }}-${{ github.sha }}
          restore-keys: lint-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'eslint.config.js', '.prettierrc*') }}-
      - name: Format
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Migrations match the schema
        run: pnpm turbo run check-migrations

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm turbo run typecheck

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm turbo run test

  test-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Pinned, so a new Postgres or pgvector release is a deliberate change here rather than a
      # surprise. PostgreSQL 18.6 with pgvector 0.8.7, matching Aurora's 18.6.
      POSTGRES_IMAGE: pgvector/pgvector:pg18@sha256:c29f30688a9ad961691bdf0ec1650717cc132a5814619d80f80463d6e4c42e47
      LGTMOOSE_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      # Started in the background, so pulling and booting it overlaps with setup instead of
      # holding the job up the way a `services:` container does.
      - name: Start Postgres
        run: |
          docker run -d --name postgres -p 5432:5432 -e POSTGRES_PASSWORD=postgres \
            "$POSTGRES_IMAGE" > /tmp/postgres.log 2>&1 &
      - uses: ./.github/actions/setup
      - name: Wait for Postgres
        run: |
          for _ in $(seq 1 60); do
            docker exec postgres pg_isready -U postgres >/dev/null 2>&1 && exit 0
            sleep 1
          done
          cat /tmp/postgres.log
          exit 1
      - run: pnpm turbo run test:integration

  # Builds every package, then runs the built CLI the way a user does.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm turbo run build smoke

  synth:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm turbo run synth
