version: 2
updates:
  # Workflows and the composite action in .github/actions. Bumps of third-party actions run with
  # CI's tokens, so read their diff before merging; see CONTRIBUTING.md.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-tooling:
        dependency-type: development
    ignore:
      # @types/node stays on the runtime's major (Node 24, see engines and the images). Newer
      # types would let code use Node APIs that the runtime doesn't have. Move it with the runtime.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  # The Postgres image the integration tests use.
  - package-ecosystem: docker
    directory: /tools/test-postgres
    schedule:
      interval: weekly
  # The egress proxy's Node base image.
  - package-ecosystem: docker
    directory: /apps/egress-proxy
    schedule:
      interval: weekly
