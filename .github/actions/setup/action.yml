name: Set up the workspace
description: >-
  Node from .nvmrc, pnpm, dependencies from the cached pnpm store, and turbo's remote cache.
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6

    # Caches the pnpm store keyed on pnpm-lock.yaml, so install only links packages.
    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - run: pnpm install --frozen-lockfile
      shell: bash

    # A turbo remote cache server backed by the Actions cache: one entry per task hash, shared by
    # every job and branch, so a package is built once per change rather than once per job.
    # Entries never change, and GitHub evicts unused ones, so nothing needs pruning. Pinned by
    # commit because it runs with the job's token.
    - uses: rharkor/caching-for-turbo@760158c05c47e7a764f78e9a22ca3b5a6ed8c52e # v2.5.2
