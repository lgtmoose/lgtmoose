packages:
  - apps/*
  - packages/*
  - infra/*

# pnpm 10 blocks dependency install scripts by default; allow only what we need.
onlyBuiltDependencies:
  - esbuild

# TypeScript 7, the native compiler, for the root and every package: about 5x faster than 5.9
# with the same JavaScript output. Each package depends on it too, so its own `tsc` is pinned.
catalog:
  typescript: 7.0.2

# Don't resolve a package version until it has been published for 3 days (in minutes), the same
# window Dependabot uses. A malicious release is usually caught and pulled within that time.
# Installs from the lockfile (--frozen-lockfile, as CI and the images do) aren't affected; this
# applies when versions are resolved: `pnpm add`, `pnpm update`, or a lockfile change.
minimumReleaseAge: 4320
