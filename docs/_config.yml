# GitHub Pages builds this folder with Jekyll (.github/workflows/docs.yml). The pages are plain
# Markdown that also reads well on github.com: links between them are relative `.md` links, which
# jekyll-relative-links turns into page links, and titles come from each page's first heading.
title: LGTMoose
description: A self-hosted, open-source AI pull request reviewer.
theme: jekyll-theme-primer
plugins:
  - jekyll-relative-links
  - jekyll-optional-front-matter
  - jekyll-titles-from-headings
relative_links:
  enabled: true
  collections: false
optional_front_matter:
  remove_originals: true
titles_from_headings:
  enabled: true
  strip_title: false
